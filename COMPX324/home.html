<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styling.css" />
    <title>FinPrivSys</title>
  </head>
  <body data-page="home">
    <nav>
      <p class="title-text">FinPrivSys</p>
      <a href="" id="homeButton">Dashboard</a>
      <a href="" id="logoutButton">Logout</a>
    </nav>
    <main>
      <h1>Hello, Name</h1>
      <h3>Connected Accounts</h3>
      <div id="connections-list">
        <button class="connection-button" id="account1Button">
          <table class="connection-table" id="account1">
            <tr>
              <th class="col1">Account 1</th>
            </tr>
            <tr>
              <td class="col1">Field1</td>
              <td class="col2">Value1</td>
            </tr>
            <tr>
              <td class="col1">Field2</td>
              <td class="col2">Value2</td>
            </tr>
            <tr>
              <td class="col1">Field3</td>
              <td class="col2">Value3</td>
            </tr>
            <tr>
              <td class="col1">Field4</td>
              <td class="col2">Value4</td>
            </tr>
          </table>
        </button>
        <button href="" class="connection-button" id="account2Button">
          <table class="connection-table" id="account2">
            <tr>
              <th class="col1">Account 2</th>
            </tr>
            <tr>
              <td class="col1">Field1</td>
              <td class="col2">Value1</td>
            </tr>
            <tr>
              <td class="col1">Field2</td>
              <td class="col2">Value2</td>
            </tr>
            <tr>
              <td class="col1">Field3</td>
              <td class="col2">Value3</td>
            </tr>
            <tr>
              <td class="col1">Field4</td>
              <td class="col2">Value4</td>
            </tr>
          </table>
        </button>
        <button href="" class="connection-button" id="account3Button">
          <table class="connection-table" id="account3">
            <tr>
              <th class="col1">Account 3</th>
            </tr>
            <tr>
              <td class="col1">Field1</td>
              <td class="col2">Value1</td>
            </tr>
            <tr>
              <td class="col1">Field2</td>
              <td class="col2">Value2</td>
            </tr>
            <tr>
              <td class="col1">Field3</td>
              <td class="col2">Value3</td>
            </tr>
            <tr>
              <td class="col1">Field4</td>
              <td class="col2">Value4</td>
            </tr>
          </table>
        </button>
        <button id="viewConnectionsButton">
          View All Connections
        </button>
      </div>
    </main>
    <script type="module" src="scripts.js"></script>
  </body>
</html>
